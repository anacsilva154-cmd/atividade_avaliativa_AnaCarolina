<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 1</title>
    <link rel="stylesheet" href="_css/style.css">
</head>
<body>
    <h1>Exemplo de Formulário em HTML</h1>
    <hr>

    <h2>Exemplo 01</h2>
    <div class="exemplo1">
    
    <input type="text" name="nome" placeholder="Nome">
    <input type="text" name="email" placeholder="E-mail">
    <input type="text" name="celular" placeholder="Celular">
    <input type="text" name="senha" placeholder="Senha">

    <button id="button1" type="submit">Cadastrar</button>
</div>
    <hr>

    <h2>Exemplo 02</h2>
    <div class="exemplo2">

    <textarea cols="40" rows="5"></textarea>
    <hr>
    </div>

    <h2>Exemplo 03</h2>
    <div class="exemplo3">
    <fieldset>
        <legend>Formulário</legend>
        Nome:
        <input type="text" name="nome" >
        <br><br>

        Sexo:
        <input type="radio" name="sexo" value="Masculino" checked> Masculino 
        <input type="radio" name="sexo" value="Feminino"> Feminino
        <br><br>

        País:
        <select name="pais">
            <option >Selecione uma opção</option>
            <option value="Brasil">Brasil</option>
            <option value="Canadá">Canadá</option>
            <option value="EUA">EUA</option>
            <option value="Australia">Australia</option>
            <option value="India">India</option>
        </select>
        <br><br>

        Mensagem: <br>
        <textarea name="mensagem" cols="20" rows="5"></textarea>
        <br><br>

        <input type="checkbox" name="aceito" value="assinar"> Assinar Newsletter?
        <br><br>

        <input type="submit" value="Enviar" id="enviar">
    </div>
        <hr>
        <br>
    </fieldset>

    <h2>Exemplo 04</h2>
    <div class="exemplo4"></div>
    
    <textarea cols="25" rows="3" ID="exemplo4" ></textarea>
    <button  id="button2" type="button">Clique para Pesquisar</button> 
</div>
    <hr>

    <h2>Exemplo 05</h2>
    <div class="exemplo5"></div>
    <fieldset>
        <legend>Selecione uma cor que mais te agrada?</legend>

        <input type="checkbox" name="cor" value="azul" > azul
        <input type="checkbox" name="cor" value="vermelho"> vermelho
        <input type="checkbox" name="cor" value="verde"> verde
        <input type="checkbox" name="cor" value="amarelo"> amarelo

    </fieldset>

    
</body>
</html>
